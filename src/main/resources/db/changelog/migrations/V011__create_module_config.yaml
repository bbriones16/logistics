databaseChangeLog:
  - changeSet:
      id: V011-1
      author: system
      changes:
        - createTable:
            tableName: module_config
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: module_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    unique: true
                    foreignKeyName: fk_module_config_catalog
                    references: module_catalog(id)
              - column:
                  name: enabled
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: configuration_json
                  type: VARCHAR(2000)
              - column:
                  name: effective_from
                  type: TIMESTAMP
              - column:
                  name: effective_until
                  type: TIMESTAMP
              - column:
                  name: updated_by
                  type: VARCHAR(255)
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: version
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false

  - changeSet:
      id: V011-2
      author: system
      changes:
        - sql:
            sql: INSERT INTO module_config (module_id, enabled, updated_by) SELECT id, true, 'system' FROM module_catalog WHERE module_key = 'DOMESTIC_LOGISTICS'

  - changeSet:
      id: V011-3
      author: system
      changes:
        - sql:
            sql: INSERT INTO module_config (module_id, enabled, updated_by) SELECT id, false, 'system' FROM module_catalog WHERE module_key != 'DOMESTIC_LOGISTICS'
