databaseChangeLog:
  - changeSet:
      id: create-drivers-table
      author: logistics
      changes:
        - createTable:
            tableName: drivers
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(150)
                  constraints:
                    nullable: false
              - column:
                  name: license_number
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: phone
                  type: VARCHAR(30)
              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
                  defaultValue: AVAILABLE
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
                  defaultValueComputed: NOW()

  - changeSet:
      id: create-vehicles-table
      author: logistics
      changes:
        - createTable:
            tableName: vehicles
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: plate_number
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: vehicle_type
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: capacity_kg
                  type: DECIMAL(10,2)
              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
                  defaultValue: AVAILABLE
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
                  defaultValueComputed: NOW()

  - changeSet:
      id: create-deliveries-table
      author: logistics
      changes:
        - createTable:
            tableName: deliveries
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: shipment_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    unique: true
                    foreignKeyName: fk_delivery_shipment
                    references: shipments(id)
              - column:
                  name: driver_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_delivery_driver
                    references: drivers(id)
              - column:
                  name: vehicle_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_delivery_vehicle
                    references: vehicles(id)
              - column:
                  name: status
                  type: VARCHAR(30)
                  constraints:
                    nullable: false
                  defaultValue: ASSIGNED
              - column:
                  name: scheduled_date
                  type: DATE
              - column:
                  name: notes
                  type: VARCHAR(500)
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
                  defaultValueComputed: NOW()
