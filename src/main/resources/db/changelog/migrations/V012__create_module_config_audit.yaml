databaseChangeLog:
  - changeSet:
      id: V012-1
      author: system
      changes:
        - createTable:
            tableName: module_config_audit
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: module_key
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: previous_value
                  type: VARCHAR(2000)
              - column:
                  name: new_value
                  type: VARCHAR(2000)
                  constraints:
                    nullable: false
              - column:
                  name: changed_by
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: changed_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: reason
                  type: VARCHAR(500)
