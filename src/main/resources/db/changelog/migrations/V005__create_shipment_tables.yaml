databaseChangeLog:
  - changeSet:
      id: 005-create-carriers
      author: logistics
      changes:
        - createTable:
            tableName: carriers
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: code
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: medium
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: company_owned
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: contact_name
                  type: VARCHAR(255)
              - column:
                  name: contact_phone
                  type: VARCHAR(50)
              - column:
                  name: active
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false

  - changeSet:
      id: 005-create-shipments
      author: logistics
      changes:
        - createTable:
            tableName: shipments
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: shipment_type
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: order_id
                  type: BIGINT
                  constraints:
                    nullable: true
                    foreignKeyName: fk_shipment_order
                    references: orders(id)
              - column:
                  name: carrier_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_shipment_carrier
                    references: carriers(id)
              - column:
                  name: medium
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: tracking_number
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: status
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: cargo_description
                  type: VARCHAR(500)
              - column:
                  name: quantity
                  type: INT
              - column:
                  name: weight_kg
                  type: DECIMAL(10, 2)
              - column:
                  name: freight_cost
                  type: DECIMAL(10, 2)
              - column:
                  name: ship_to_address
                  type: VARCHAR(500)
                  constraints:
                    nullable: false
              - column:
                  name: estimated_delivery_date
                  type: DATE
              - column:
                  name: actual_delivery_date
                  type: DATE
              - column:
                  name: proof_of_delivery
                  type: VARCHAR(500)
              - column:
                  name: notes
                  type: VARCHAR(1000)
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
