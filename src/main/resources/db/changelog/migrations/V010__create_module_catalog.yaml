databaseChangeLog:
  - changeSet:
      id: V010-1
      author: system
      changes:
        - createTable:
            tableName: module_catalog
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: module_key
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: name
                  type: VARCHAR(200)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: VARCHAR(500)
              - column:
                  name: module_type
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: active
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

  - changeSet:
      id: V010-2
      author: system
      changes:
        - insert:
            tableName: module_catalog
            columns:
              - column:
                  name: module_key
                  value: DOMESTIC_LOGISTICS
              - column:
                  name: name
                  value: Domestic Logistics
              - column:
                  name: description
                  value: Existing domestic operations
              - column:
                  name: module_type
                  value: CORE
              - column:
                  name: active
                  valueBoolean: true
        - insert:
            tableName: module_catalog
            columns:
              - column:
                  name: module_key
                  value: INTERNATIONAL_FREIGHT
              - column:
                  name: name
                  value: International Freight
              - column:
                  name: description
                  value: Freight forwarding and shipment management
              - column:
                  name: module_type
                  value: BUSINESS
              - column:
                  name: active
                  valueBoolean: true
        - insert:
            tableName: module_catalog
            columns:
              - column:
                  name: module_key
                  value: CUSTOMS_CLEARANCE
              - column:
                  name: name
                  value: Customs Clearance
              - column:
                  name: description
                  value: Customs clearance jobs and documents
              - column:
                  name: module_type
                  value: BUSINESS
              - column:
                  name: active
                  valueBoolean: true
        - insert:
            tableName: module_catalog
            columns:
              - column:
                  name: module_key
                  value: FREIGHT_CUSTOMS_INTEGRATION
              - column:
                  name: name
                  value: Freight-Customs Integration
              - column:
                  name: description
                  value: Link freight shipments and clearance jobs
              - column:
                  name: module_type
                  value: INTEGRATION
              - column:
                  name: active
                  valueBoolean: true
        - insert:
            tableName: module_catalog
            columns:
              - column:
                  name: module_key
                  value: DOMESTIC_HANDOFF
              - column:
                  name: name
                  value: Domestic Handoff
              - column:
                  name: description
                  value: Create domestic delivery jobs from international shipments
              - column:
                  name: module_type
                  value: INTEGRATION
              - column:
                  name: active
                  valueBoolean: true
        - insert:
            tableName: module_catalog
            columns:
              - column:
                  name: module_key
                  value: CUSTOMER_PORTAL
              - column:
                  name: name
                  value: Customer Portal
              - column:
                  name: description
                  value: Customer-facing tracking and documents
              - column:
                  name: module_type
                  value: BUSINESS
              - column:
                  name: active
